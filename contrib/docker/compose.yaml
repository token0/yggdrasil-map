services:
  yggdrasil-map:
    image: ${MAP_IMAGE}
    container_name: yggdrasil-map
    restart: unless-stopped
    environment:
      YGG_PEERS: ${YGG_PEERS}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL}
    volumes:
      # Stack directory: yggdrasil.conf is generated here on first start
      - ./:/config
    ports:
      - ${MAP_BIND}:${MAP_PORT}:3000
